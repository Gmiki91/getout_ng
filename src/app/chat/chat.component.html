@if(!chatCollapsed()){
<div class="chat-container">
  <div class="header">
    <span class="title">{{ receiver().name }}</span>
    <button mat-icon-button class="collapse-btn" (click)="toggleChat()">
      <mat-icon>minimize</mat-icon>
    </button>
  </div>
  <div class="messages">
    @for(msg of messages(); track msg.id){
    <div class="message">
      <span class="sender">{{ msg.sender.name }}:</span>
      <span class="content">{{ msg.text }}</span>
    </div>
    }
  </div>

  <div class="input-box">
    <input
      [(ngModel)]="text"
      placeholder="Type a message..."
      (keyup.enter)="send()"
    />
    <button (click)="send()">Send</button>
  </div>
</div>
}@else {
<div class="chat-container-collapsed">
  <span class="title" (click)="toggleChat()">{{ receiver().name }}</span>
</div>
}
